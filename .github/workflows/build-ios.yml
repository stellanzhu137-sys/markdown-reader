name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        working-directory: MarkdownReader
        run: xcodebuild -resolvePackageDependencies -project MarkdownReader.xcodeproj -scheme MarkdownReader

      - name: Build unsigned app
        working-directory: MarkdownReader
        run: |
          xcodebuild \
            -project MarkdownReader.xcodeproj \
            -scheme MarkdownReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        working-directory: MarkdownReader
        run: |
          APP_PATH=$(find DerivedData -name "MarkdownReader.app" -path "*Release-iphoneos*" | head -n 1)
          echo "App path: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MarkdownReader.ipa Payload
          ls -lh MarkdownReader.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkdownReader-ipa
          path: MarkdownReader/MarkdownReader.ipa
